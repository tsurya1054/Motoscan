<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#090A0F" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="redlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1E2530" stroke-width="4" />

  <!-- Outer Gauge Ring Track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#13171F" stroke-width="24" />

  <!-- Active Neon Sweep Gauge Arc (Starting from 6 o'clock and sweeping clockwise) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonCyan)" stroke-width="24"
    stroke-dasharray="840 1131" stroke-dashoffset="283" stroke-linecap="round" filter="url(#glow)" />

  <!-- Redline Warning Arc Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#redlineGrad)" stroke-width="24"
    stroke-dasharray="140 1131" stroke-dashoffset="-560" stroke-linecap="round" />

  <!-- Center Hub Display -->
  <circle cx="256" cy="256" r="115" fill="#11141A" stroke="#1E2530" stroke-width="6" />

  <!-- Motorcycle ADV Silhouette / Tachometer Needle -->
  <path d="M256 160 L270 240 L256 256 L242 240 Z" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#00E5FF" />
  <circle cx="256" cy="256" r="8" fill="#090A0F" />

  <!-- ADV Text -->
  <text x="256" y="325" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="28" font-weight="900" letter-spacing="4">
    MOTOSCAN
  </text>
  <text x="256" y="352" text-anchor="middle" fill="#00E5FF" font-family="monospace" font-size="18" font-weight="800" letter-spacing="6">
    ADV 150/160
  </text>
</svg>
